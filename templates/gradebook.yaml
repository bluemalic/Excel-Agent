template_id: gradebook
name: 成绩单
description: 记录学生各科成绩，适合分布/及格率/相关性分析
sheets:
  - name: 成绩
    columns:
      - {name: 学号,   type: string, required: true}
      - {name: 姓名,   type: string, required: true}
      - {name: 班级,   type: enum,   values: [一班, 二班, 三班]}
      - {name: 语文,   type: decimal, min: 0, max: 150}
      - {name: 数学,   type: decimal, min: 0, max: 150}
      - {name: 英语,   type: decimal, min: 0, max: 150}
    presets:
      - "各班数学平均分对比"
      - "数学与英语成绩的相关性"
